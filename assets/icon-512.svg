<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d80;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado para 512x512 -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGradient512)"/>
  
  <!-- Borde interior -->
  <rect x="48" y="48" width="416" height="416" rx="64" ry="64" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Texto RC -->
  <text x="160" y="340" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="220" 
        font-weight="bold" 
        fill="white">R</text>
  
  <text x="352" y="340" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="220" 
        font-weight="bold" 
        fill="white">C</text>
  
  <!-- Línea decorativa -->
  <line x1="250" y1="280" x2="262" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Punto decorativo -->
  <circle cx="256" cy="420" r="12" fill="rgba(255,255,255,0.4)"/>
</svg>
