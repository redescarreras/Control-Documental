<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d80;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Sombra para el texto -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#003d80" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Borde interior sutil -->
  <rect x="48" y="48" width="416" height="416" rx="64" ry="64" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Texto "RC" -->
  <g filter="url(#textShadow)">
    <!-- Letra R -->
    <text x="160" y="340" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="220" 
          font-weight="bold" 
          fill="white"
          text-anchor="middle">R</text>
    
    <!-- Letra C -->
    <text x="352" y="340" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="220" 
          font-weight="bold" 
          fill="white"
          text-anchor="middle">C</text>
  </g>
  
  <!-- Detalles decorativos - líneas de conexión -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="6" stroke-linecap="round">
    <!-- Línea entre R y C -->
    <line x1="250" y1="280" x2="260" y2="280"/>
  </g>
  
  <!-- Punto decorativo -->
  <circle cx="256" cy="420" r="12" fill="rgba(255,255,255,0.4)"/>
</svg>
